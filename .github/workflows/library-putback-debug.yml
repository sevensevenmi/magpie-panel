name: Library putback debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: focused (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Focused library tests
        run: go test -v -count=1 -timeout 5m ./internal/library -run '^(TestRemovedImportGoesBackToTheAgents|TestRemovedLinkedImportGoesBack|TestSharedIsLibraryNested)$'
