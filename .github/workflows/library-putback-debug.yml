name: Library putback debug

on:
  workflow_dispatch:
  push:
    branches: [debug/linux-skill-putback]
    paths:
      - .github/workflows/library-putback-debug.yml
      - internal/library/**

permissions:
  contents: read

jobs:
  focused:
    name: focused (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Focused library tests
        run: go test -v -count=1 -timeout 5m -tags "${{ runner.os == 'Linux' && 'gtk3' || '' }}" ./internal/library -run '^(TestRemovedImportGoesBackToTheAgents|TestRemovedLinkedImportGoesBack|TestSharedIsLibraryNested)$'
